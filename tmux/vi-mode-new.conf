# remap visual mode mappings to be more like vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Space send-keys -X clear-selection
# copy to system clipboard with y in copy-mode-vi mode
bind -T copy-mode-vi Y {
    if-shell "hash clip.exe" {
        send-keys -X copy-pipe "cat | clip.exe"
    } {
        if-shell "hash pbcopy" {
            send-keys -X copy-pipe "cat | pbcopy"
        } {
            send-keys -X copy-pipe "cat | xsel -ib"
        }
    }
    send-keys -X copy-selection;
}
bind -T copy-mode-vi y {
    if-shell "hash clip.exe" {
        send-keys -X copy-pipe "cat | clip.exe"
    } {
        if-shell "hash pbcopy" {
            send-keys -X copy-pipe "cat | pbcopy"
        } {
            send-keys -X copy-pipe "cat | xsel -ib"
        }
    }
    send-keys -X copy-selection-and-cancel;
}

bind -T copy-mode-vi ? command-prompt -p "(search up)" {
    send-keys -X search-backward "%%"
}
bind -T copy-mode-vi / command-prompt -p "(search down)" {
    send-keys -X search-forward "%%"
}

# The selection goes to nvim-open on stdin. --from-pane because copy-pipe runs
# the command with no TMUX_PANE and with the tmux server's directory as its cwd,
# so without it we would neither know which session to look in nor what a
# relative path in the selection is relative to.
#
# --copy-mode is for the usual case of no selection at all: copy-pipe runs the
# command either way and simply gives it an empty stdin, so nvim-open can go and
# ask tmux for the line under the copy-mode cursor and open the location there.
# Just move onto a path in some output and hit C-g.
bind -T copy-mode-vi C-g send-keys -X copy-pipe "nvim-open --focus --copy-mode --from-pane '#{pane_id}'"
bind -T copy-mode-vi i send-keys -X cancel
